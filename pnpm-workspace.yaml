packages:
  - 'packages/*'
  - 'apps/*'

# Keep vulnerable transitive tooling/runtime packages on patched releases.
# Version-line-specific selectors avoid forcing incompatible major upgrades.
overrides:
  '@babel/core@<=7.29.0': 7.29.6
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'ws@>=7.0.0 <8.0.0': 7.5.11
  'ws@>=8.0.0 <9.0.0': 8.21.3
  axios: 1.18.0
  form-data: 4.0.6
  uuid: 11.1.1
